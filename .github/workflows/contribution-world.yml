name: Contribution World
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: contribution-world
  cancel-in-progress: false
jobs:
  generate:
    if: github.repository == 'gdfaler/gdfaler'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test generator
        run: python -m unittest discover -s tests -v
      - name: Fetch real activity and render both themes
        env:
          GH_TOKEN: ${{ secrets.CONTRIBUTIONS_TOKEN || github.token }}
        run: python scripts/contribution_world.py --login gdfaler --output-dir "$RUNNER_TEMP/world"
      - name: Publish only to the image branch
        shell: bash
        run: |
          set -euo pipefail
          # The source/default branch is never committed or pushed by this job.
          set +e
          git ls-remote --exit-code --heads origin refs/heads/contribution-world > "$RUNNER_TEMP/world-ref"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            git fetch --depth=1 origin refs/heads/contribution-world
            git checkout -B contribution-world FETCH_HEAD
          elif [ "$status" -eq 2 ]; then
            git switch --orphan contribution-world
          else
            echo 'Cannot inspect output branch; refusing to publish.' >&2
            exit "$status"
          fi
          cp "$RUNNER_TEMP/world/world-dark.svg" world-dark.svg
          cp "$RUNNER_TEMP/world/world-light.svg" world-light.svg
          cp "$RUNNER_TEMP/world/calendar.json" calendar.json
          git add -- world-dark.svg world-light.svg calendar.json
          if git diff --cached --quiet; then
            echo 'Activity unchanged; no commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update contribution world'
          git push origin HEAD:refs/heads/contribution-world
