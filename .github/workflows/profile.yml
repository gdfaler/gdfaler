name: Profile preview and data
on:
  push:
    branches: [feat/profile-under-the-hood]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '47 5 * * *'
permissions:
  contents: read
concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Tests and offline reproduction
        run: |
          python -m unittest discover -s tests -v
          python scripts/profile.py
          git diff --exit-code -- assets/profile
      - name: Fresh public snapshot (trusted events only)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/profile.py --fetch --output-dir "$RUNNER_TEMP/profile"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: profile-committed-preview
          path: assets/profile
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name != 'pull_request'
        with:
          name: profile-fresh-preview
          path: ${{ runner.temp }}/profile
  publish:
    needs: preview
    if: >-
      github.repository == 'gdfaler/gdfaler' &&
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    concurrency:
      group: profile-assets-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: profile-fresh-preview
          path: ${{ runner.temp }}/profile
      - name: Publish only to profile-assets
        env:
          PROFILE_SOURCE_REF: ${{ github.ref_name }}
          PROFILE_DEFAULT_REF: ${{ github.event.repository.default_branch }}
        run: bash scripts/publish_profile.sh
