<svg xmlns="http://www.w3.org/2000/svg" width="860" height="250" viewBox="0 0 860 250" role="img" aria-label="Terminal: whoami, egor, loop. fail. upgrade. repeat.">
  <style>
    text { font-family: 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace; font-size: 20px; }
    .p { fill: #7ee787; }
    .c { fill: #e6edf3; }
    .d { fill: #8b949e; }
    .a { fill: #79c0ff; }
    .y { fill: #ffa657; }
    .r { fill: #ff7b72; }
    .rev { transform-box: fill-box; }
    @keyframes type { from { width: 0; } to { width: 780px; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .t1 { animation: type 1.0s steps(12) 0.4s both; }
    .t2 { animation: type 1.4s steps(28) 1.6s both; }
    .t3 { animation: type 1.0s steps(14) 3.4s both; }
    .t4 { animation: type 1.6s steps(34) 4.6s both; }
    .t5 { animation: type 1.0s steps(10) 6.6s both; }
    .t6 { animation: type 1.8s steps(26) 7.8s both; }
    .cursor { animation: blink 1s steps(1) infinite; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <clipPath id="c1"><rect class="t1" x="40" y="62" height="30"/></clipPath>
    <clipPath id="c2"><rect class="t2" x="40" y="92" height="30"/></clipPath>
    <clipPath id="c3"><rect class="t3" x="40" y="116" height="30"/></clipPath>
    <clipPath id="c4"><rect class="t4" x="40" y="146" height="30"/></clipPath>
    <clipPath id="c5"><rect class="t5" x="40" y="170" height="30"/></clipPath>
    <clipPath id="c6"><rect class="t6" x="40" y="200" height="30"/></clipPath>
  </defs>

  <rect x="1" y="1" width="858" height="248" rx="14" fill="url(#bg)" stroke="#30363d"/>
  <rect x="1" y="1" width="858" height="38" rx="14" fill="#161b22"/>
  <rect x="1" y="26" width="858" height="13" fill="#161b22"/>
  <line x1="1" y1="39" x2="859" y2="39" stroke="#30363d"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="20" r="6" fill="#27c93f"/>
  <text x="430" y="25" text-anchor="middle" class="d" style="font-size:13px">gdfaler — zsh — 80×24</text>

  <g clip-path="url(#c1)"><text x="40" y="82"><tspan class="p">~ $ </tspan><tspan class="c">whoami</tspan></text></g>
  <g clip-path="url(#c2)"><text x="40" y="106" class="a">egor · CS student @ BMSTU</text></g>
  <g clip-path="url(#c3)"><text x="40" y="136"><tspan class="p">~ $ </tspan><tspan class="c">cat now.txt</tspan></text></g>
  <g clip-path="url(#c4)"><text x="40" y="160"><tspan class="y">swift</tspan><tspan class="d"> · </tspan><tspan class="y">llm from scratch</tspan><tspan class="d"> · </tspan><tspan class="y">opengl</tspan></text></g>
  <g clip-path="url(#c5)"><text x="40" y="190"><tspan class="p">~ $ </tspan><tspan class="c">./loop.sh</tspan></text></g>
  <g clip-path="url(#c6)"><text x="40" y="220"><tspan class="r">fail.</tspan><tspan class="y"> upgrade.</tspan><tspan class="p"> repeat.</tspan></text></g>
  <rect class="cursor" x="312" y="204" width="11" height="22" fill="#e6edf3"/>
</svg>
