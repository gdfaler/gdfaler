<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 208" width="900" height="208" role="img" aria-labelledby="title desc">
<title id="title">Developer Terminal</title><desc id="desc">A humorous terminal: learn, build, break, repeat. Sleep dependency not found. Decorative animation, no live shell.</desc>
<style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;fill:#e6edf3}.muted{fill:#9aafc2}.accent{fill:#8adead}.line{stroke:#2a3a48}.panel{fill:#15212d}.t0{animation-delay:0.0s}.t1{animation-delay:1.1s}.t2{animation-delay:2.2s}.t3{animation-delay:3.3000000000000003s}.t4{animation-delay:4.4s}.type{animation:typing 10s steps(34,end) infinite;clip-path:inset(0 0 0 0)}@keyframes typing{0%{clip-path:inset(0 100% 0 0)}12%,100%{clip-path:inset(0 0 0 0)}}.cursor{animation:blink 1s steps(2,end) infinite}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.type,.cursor{animation:none;clip-path:none}}</style>
<rect width="900" height="208" rx="24" fill="#0d141d"/><text x="24" y="29" font-size="10" class="muted" letter-spacing="1">TERMINAL / gdfaler — zsh</text><g class="type t0"><text x="24" y="61" font-size="13" class="accent" >$ whoami</text></g><g class="type t1"><text x="24" y="85" font-size="13" class="" >Egor / building things from scratch</text></g><g class="type t2"><text x="24" y="109" font-size="13" class="accent" >$ ./life.sh</text></g><g class="type t3"><text x="24" y="133" font-size="13" class="" >[OK] learn → build → break → repeat</text></g><g class="type t4"><text x="24" y="157" font-size="13" class="" >[WARN] sleep: dependency not found</text></g><rect class="cursor" x="24" y="174" width="8" height="14" fill="#479d72"/></svg>