<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 196" width="420" height="196" role="img" aria-labelledby="title desc">
<title id="title">GitHub Dynamic Island</title><desc id="desc">Cycles through latest authored default-branch commit, latest stable release and seven-day authored commit count. Public snapshot, not a live connection.</desc>
<style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;fill:#1d352d}.muted{fill:#536b61}.accent{fill:#26704d}.line{stroke:#c6d5cd}.panel{fill:#e7eee8}.island{transform-box:fill-box;transform-origin:center;animation:breathe 18s ease-in-out infinite}.state{opacity:0;animation:cycle 18s infinite}.s0{opacity:1}.s1{animation-delay:6s}.s2{animation-delay:12s}@keyframes cycle{0%,30%{opacity:1}33%,100%{opacity:0}}@keyframes breathe{0%,30%,36%,63%,69%,96%,100%{transform:scaleX(1)}33%,66%,99%{transform:scaleX(.94)}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.state,.island,.pulse{animation:none}.s0{opacity:1}.s1,.s2{opacity:0}}</style>
<rect width="420" height="196" rx="24" fill="#f4f7f3"/><text x="24" y="28" font-size="10" class="muted" letter-spacing="2">GDFALER / UNDER THE HOOD</text><rect class="island panel" x="18" y="43" width="384" height="116" rx="45"/><g class="state s0"><circle class="pulse" cx="42" cy="73" r="4" fill="#62bd88"/><text x="57" y="77" font-size="10" class="muted" letter-spacing="2">LATEST COMMIT</text><text x="40" y="108" font-size="16" class="" >gdfaler · 8568bf0</text><text x="40" y="132" font-size="11" class="muted" >Merge pull request #6 from gdfaler/f…</text></g><g class="state s1"><circle class="pulse" cx="42" cy="73" r="4" fill="#62bd88"/><text x="57" y="77" font-size="10" class="muted" letter-spacing="2">LATEST RELEASE</text><text x="40" y="108" font-size="16" class="" >DynamicIsland · v1.3.1</text><text x="40" y="132" font-size="11" class="muted" >2026-11-10 · stable public release</text></g><g class="state s2"><circle class="pulse" cx="42" cy="73" r="4" fill="#62bd88"/><text x="57" y="77" font-size="10" class="muted" letter-spacing="2">WEEKLY ACTIVITY</text><text x="40" y="108" font-size="16" class="" >8 authored commits · 7 UTC days</text><text x="40" y="132" font-size="11" class="muted" >2026-11-21 → 2026-11-27</text></g><text x="396" y="181" font-size="9" class="muted" text-anchor="end">PUBLIC SNAPSHOT · 2026-11-27</text></svg>